author: cyber.netsecops.io
date: 2026-11-17
tags:
  - attack.t1033
  - attack.t1016
  - attack.t1087
  - attack.discovery
level: medium
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
      - '\w3wp.exe'
      - '\httpd.exe'
  selection_child:
    Image|endswith:
      - '\whoami.exe'
