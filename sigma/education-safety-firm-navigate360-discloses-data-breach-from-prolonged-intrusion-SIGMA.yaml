title: Suspicious Archive File Creation
id: 975306c8-c9e3-4d1e-93d1-a80d20b7a386
status: experimental
description: Detects the creation of archive files (.zip, .rar, .7z), which could be used for staging data prior to exfiltration.
references:
  - https://www.claimdepot.com/data-breach/navigate360-2026
author: cyber.netsecops.io
date: 2026-10-25
tags:
  - attack.t1560
level: low
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|endswith:
      - '.zip'
      - '.rar'
      - '.7z'
  condition: selection
