author: cyber.netsecops.io
date: 2026-10-25
tags:
  - attack.t1082
  - attack.discovery
level: medium
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\adfind.exe'
  condition: selection