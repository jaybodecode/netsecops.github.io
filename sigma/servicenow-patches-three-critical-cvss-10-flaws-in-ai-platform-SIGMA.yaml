title: Suspicious Child Process from ServiceNow Platform
id: b3c4d5e6-f7a8-4b0c-9def-0123456789ab
status: experimental
description: Detects suspicious child processes spawned by ServiceNow's core Java or Node.js processes, indicating potential remote code execution.
references:
  - https://thehackernews.com/2026/08/three-cvss-100-servicenow-flaws-could.html
author: cyber.netsecops.io
date: 2026-08-28
tags:
  - attack.t1059
level: high
logsource:
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith:
      - '\java.exe'
      - '\node.exe'
      - '/java'
      - '/node'
  selection_child:
    Image|endswith:
      - '\powershell.exe'
      - '\cmd.exe'
      - '\sh.exe'
      - '\bash.exe'
      - '\curl.exe'
      - '\wget.exe'
      - '/sh'
      - '/bash'
      - '/curl'
      - '/wget'
  condition: all of selection_*