title: VSSAdmin Shadow Copy Deletion
id: 2b9a1b3c-8d4e-4f6a-9b1c-5d6e7f8a9b0c
status: experimental
description: Detects the use of vssadmin.exe to delete volume shadow copies, a common precursor to ransomware deployment as used by SafePay ransomware.
references:
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-293a
author: cyber.netsecops.io
date: 2026-10-21
tags:
  - attack.t1490
  - attack.impact
level: high
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains|all:
      - 'delete'
      - 'shadows'
  condition: selection
---
title: WMIC Shadow Copy Deletion
id: 9e8f7d6c-5b4a-4c3d-8e2f-1a0b9c8d7e6f
status: experimental
description: Detects the use of wmic.exe to delete volume shadow copies, a common precursor to ransomware deployment as used by SafePay ransomware.
references:
