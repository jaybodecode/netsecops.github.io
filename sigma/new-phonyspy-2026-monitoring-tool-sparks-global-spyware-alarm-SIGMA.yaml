title: PhonySpy 2026 Suspicious Process Execution
id: 8b4a092c-d7e1-4f09-8a1b-c2d3e4f5a6b7
status: experimental
description: Detects the execution of processes associated with the PhonySpy 2026 spyware toolkit, based on hunting hints provided in the report.
references:
  - https://www.netsec.io/threat-intelligence/new-phonyspy-2026-monitoring-tool-sparks-global-spyware-alarm/
author: cyber.netsecops.io
date: 2026-07-24
tags:
  - attack.t1547
  - attack.persistence
level: medium
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\monitor.exe'
      - '\syshost.exe'
  condition: selection
---
title: Suspicious Regsvr32 Execution with Silent and Install Flags
id: 7a39f81e-c6d0-4e8b-9f0a-b1c2d3e4f5a6
status: experimental
description: Detects the use of regsvr32.exe with /s and /i flags, which can be used to execute malicious scripts. This pattern was suggested as a hunting hint for PhonySpy 2026.
references:
  - https://www.netsec.io/threat-intelligence/new-phonyspy-2026-monitoring-tool-sparks-global-spyware-alarm/
author: cyber.netsecops.io
date: 2026-07-24
tags:
  - attack.t1218.010
  - attack.defense_evasion
level: medium
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\regsvr32.exe'
    CommandLine|contains|all:
      - ' /s'
      - ' /i'
  condition: selection
---
