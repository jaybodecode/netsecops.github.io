title: Suspicious SafePal Phishing Email Subjects
id: 1a2b3c4d-5e6f-4a9b-8c7d-6e5f4a3b2c1d
status: experimental
description: Detects suspicious email subject lines related to the SafePal data breach, indicating potential phishing attempts.
references:
  - https://www.helpnetsecurity.com/2026/08/17/safepal-data-breach-customer-order-information/
author: cyber.netsecops.io
date: 2026-08-17
tags:
  - attack.t1566.002
  - attack.initial_access
level: medium
logsource:
  category: email
detection:
  selection:
    Subject|contains:
      - 'Urgent: Secure Your SafePal Wallet'
      - 'Action Required: SafePal Order Confirmation Issue'
      - 'Your SafePal Assets Are At Risk'
  condition: selection
---
title: SafePal Phishing Typosquatting Domain DNS Query
id: 7c5d8a3e-1b9f-4e2a-8d6c-9f8b7a6d5c4b
status: experimental
description: Detects DNS queries for a typosquatted domain related to SafePal, likely used in phishing campaigns targeting wallet users.
references:
  - https://www.helpnetsecurity.com/2026/08/17/safepal-data-breach-customer-order-information/
author: cyber.netsecops.io
date: 2026-08-17
tags:
  - attack.t1566.002
  - attack.initial_access
level: high
logsource:
  category: dns_query
  product: windows
detection:
  selection:
    QueryName|contains:
      - 'safepal-support.io'
  condition: selection