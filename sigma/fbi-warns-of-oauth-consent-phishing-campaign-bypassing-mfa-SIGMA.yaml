title: Azure AD New Application Consent Grant
id: 2b8c9a1f-3d4e-4f5a-8b6c-1d2e3f4a5b6c
status: experimental
description: Detects when a user grants delegated permissions to an application in Azure AD, a key event in OAuth consent phishing attacks.
references:
  - https://www.ic3.gov/PSA/2026/PSA260901
author: cyber.netsecops.io
date: 2026-09-06
tags:
  - attack.t1204
level: medium
logsource:
  product: azure
  service: auditlogs
detection:
  selection:
    OperationName: 'Add delegated permission grant'
  condition: selection
---
title: Azure AD Consent to Unverified Publisher Application
id: 21c880ba-0286-4ac3-9988-41b1813ef8e1
status: experimental
description: Detects when a user grants consent to an application from an unverified publisher, which is a high-risk indicator for consent phishing.
references:
  - https://www.ic3.gov/PSA/2026/PSA260901
author: cyber.netsecops.io
date: 2026-09-06
tags:
  - attack.t1204
level: high
logsource:
  product: azure
  service: auditlogs
detection:
  selection:
    OperationName: 'Consent to application'
    TargetResources|contains: 'unverified'
  condition: selection