title: Data Staging with Common Archive Utilities
id: d3f4a5b6-c7d8-4e9f-a0b1-c2d3e4f5a6b7
status: experimental
description: Detects the creation of large archive files (zip, rar, 7z) on servers, which may indicate data staging prior to exfiltration.
author: cyber.netsecops.io
date: 2026-07-27
references:
  - https://www.securityweek.com/mcbs-data-breach-affects-1-2-million-individuals/
tags:
  - attack.t1560.001
  - attack.collection
level: medium
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|endswith:
      - '.zip'
      - '.rar'
      - '.7z'
  filter:
    Image|endswith:
      - '\explorer.exe'
      - '\winzip.exe'
      - '\7z.exe'
      - '\winrar.exe'
  condition: selection and not filter
---
title: Data Exfiltration using Cloud Sync Tools
id: 12f9a6d1-040c-49fc-9c0e-8249e03f290b
status: experimental
description: Detects the execution of command-line cloud synchronization tools such as rclone.exe or megacmd.exe, which can be used for data exfiltration.
author: cyber.netsecops.io
date: 2026-07-27
references:
  - https://www.securityweek.com/mcbs-data-breach-affects-1-2-million-individuals/
tags:
  - attack.t1567
  - attack.exfiltration
level: high
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\rclone.exe'
      - '\megacmd.exe'
  condition: selection