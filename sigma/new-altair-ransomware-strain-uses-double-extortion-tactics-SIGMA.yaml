author: cyber.netsecops.io
date: 2026-09-28
tags:
  - attack.t1486
level: critical
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|endswith: '\RANSOM_NOTE.html'
  condition: selection