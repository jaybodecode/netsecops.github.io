title: Destructive rm -rf Command Execution
id: 9c5a8d7e-1f2b-4c3d-8a9e-0f1e2d3c4b5a
status: experimental
description: Detects the execution of 'rm -rf /' command, which is a highly destructive action intended to wipe data from a Linux/Unix system.
references:
  - https://www.youtube.com/watch?v=O8VIT2ZRF4w
author: cyber.netsecops.io
date: 2026-11-07
tags:
  - attack.t1485
  - attack.t1561
  - attack.impact
logsource:
  product: linux
  category: process_creation
detection:
  selection_rm:
    Image|endswith: '/rm'
  selection_args:
    CommandLine|contains|all:
      - '-rf'
      - '/ '
  condition: all of selection_*
falsepositives:
  - Catastrophic administrative error.
level: critical