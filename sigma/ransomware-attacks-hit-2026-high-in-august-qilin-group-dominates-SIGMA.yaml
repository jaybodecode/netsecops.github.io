title: Suspicious LOLBin Execution for Ransomware Precursor Activity
id: de1d0e95-4131-489f-b944-3e16e71294f3
status: experimental
description: Detects the execution of legitimate tools often abused by ransomware operators for discovery, defense evasion, or impact.
references:
  - https://industrialcyber.co/ransomware/ransomware-activity-hits-2026-high-as-industrial-sector-bears-31-of-attacks-and-qilin-dominates/
author: cyber.netsecops.io
date: 2026-09-28
tags:
  - attack.t1059.001
  - attack.t1047
  - attack.t1490
level: medium
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\powershell.exe'
      - '\wmic.exe'
      - '\vssadmin.exe'
  condition: selection