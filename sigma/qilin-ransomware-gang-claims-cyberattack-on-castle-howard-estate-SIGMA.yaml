title: Qilin Volume Shadow Copy Deletion
id: 2b9a7c3d-1e8f-4b9a-8c7d-6e5f4d3c2b1a
status: experimental
description: Detects the use of vssadmin.exe to delete volume shadow copies, a common ransomware tactic to inhibit system recovery, associated with groups like Qilin.
author: cyber.netsecops.io
date: 2026-10-24
references:
  - https://www.hookphish.com/blog/ransomware-group-qilin-hits-castle-howard-estate/
tags:
  - attack.t1490
  - attack.impact
level: high
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains|all:
      - 'delete'
      - 'shadows'
  condition: selection
---
title: Qilin Encoded PowerShell Execution
id: e58c3541-7b9e-4998-b542-d9b63fcd934e
status: experimental
description: Detects the execution of encoded PowerShell commands, a technique used by Qilin for defense evasion.
author: cyber.netsecops.io
date: 2026-10-24
references:
  - https://www.hookphish.com/blog/ransomware-group-qilin-hits-castle-howard-estate/
tags:
  - attack.t1059.001
  - attack.execution
level: medium
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\powershell.exe'
    CommandLine|contains:
      - ' -enc '
      - ' -e '
  condition: selection
---
title: Qilin Associated Tool Execution
id: ea2660e5-c87c-4436-b6a1-df24b1f4a655
status: experimental
description: Detects the execution of tools commonly associated with Qilin ransomware group activity.
author: cyber.netsecops.io
date: 2026-10-24
references:
  - https://www.hookphish.com/blog/ransomware-group-qilin-hits-castle-howard-estate/
tags:
  - attack.t1003
  - attack.t1570
  - attack.t1018
level: high
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\mimikatz.exe'
      - '\PsExec.exe'
      - '\net.exe'
      - '\nltest.exe'
  condition: selection