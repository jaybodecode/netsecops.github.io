title: Suspicious Registry Run Key Modification
id: 1c9d8e7f-6a5b-4c5d-a3b2-e8f7a6b5c4d3
status: experimental
description: Detects modification of the HKCU Run key, a common persistence technique used by malware.
references:
  - https://www.dexpose.io/crpxo-ransomware-group-targets-qube-aviation-catering/
author: cyber.netsecops.io
date: 2026-07-28
tags:
  - attack.t1547.001
  - attack.persistence
level: medium
logsource:
  category: registry_event
  product: windows
detection:
  selection:
    TargetObject|contains: '\Software\Microsoft\Windows\CurrentVersion\Run'
  condition: selection