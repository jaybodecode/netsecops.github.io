title: Ransomware-associated Shadow Copy Deletion
id: 2b8a1c9d-5e6f-4a3b-8c1d-9e8f7a6b5c4d
status: experimental
description: Detects commands used to delete volume shadow copies, a common technique used by ransomware to inhibit system recovery.
references:
  - https://www.dexpose.io/crpxo-ransomware-group-targets-qube-aviation-catering/
author: cyber.netsecops.io
date: 2026-07-28
tags:
  - attack.t1490
  - attack.impact
level: high
logsource:
  category: process_creation
  product: windows
detection:
  selection_vssadmin:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains|all:
      - 'delete'
      - 'shadows'
  selection_wmic:
    Image|endswith: '\wmic.exe'
    CommandLine|contains|all:
      - 'shadowcopy'
      - 'delete'
  condition: 1 of selection_*
---
title: Rclone Execution for Data Exfiltration
id: 8c1d9e8f-7a6b-4c5d-a3b2-1c9d8e7f6a5b
status: experimental
description: Detects the execution of rclone.exe, a tool commonly used by ransomware groups to exfiltrate large volumes of data to cloud storage.
references:
  - https://www.dexpose.io/crpxo-ransomware-group-targets-qube-aviation-catering/
author: cyber.netsecops.io
date: 2026-07-28
tags:
  - attack.t1567.002
  - attack.exfiltration
level: medium
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\rclone.exe'
  condition: selection
