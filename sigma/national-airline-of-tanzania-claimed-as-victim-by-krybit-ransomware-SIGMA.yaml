title: Data Archiving with 7-Zip for Exfiltration
id: 94d1ee09-44e8-4b04-b9d0-2efa59374b9a
status: experimental
description: Detects the use of 7-Zip to create a password-protected archive, a common TTP for staging data for exfiltration.
references:
  - https://socradar.io/free-tools/ransomware-intelligence/victims/air-tanzania-company-limited-krybit-40443d4a
author: cyber.netsecops.io
date: 2026-09-26
tags:
  - attack.t1560.001
  - attack.collection
level: medium
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\7z.exe'
    CommandLine|contains|all:
      - ' a '
      - '-p'
  condition: selection
---
title: KRYBIT Ransomware File Artifacts
id: 2b8c1f9a-5d7e-4b0c-8a1d-9f6e3c2b1a0e
status: experimental
description: Detects the creation of KRYBIT ransom notes or files encrypted by KRYBIT ransomware.
references:
  - https://socradar.io/free-tools/ransomware-intelligence/victims/air-tanzania-company-limited-krybit-40443d4a
author: cyber.netsecops.io
date: 2026-09-26
tags:
  - attack.t1486
  - attack.impact
level: critical
logsource:
  category: file_event
  product: windows
detection:
  selection_ext:
    TargetFilename|endswith: '.krybit'
  selection_note:
    TargetFilename|contains: 'README_KRYBIT.txt'
  condition: 1 of them