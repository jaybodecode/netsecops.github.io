title: Anomalous ICS/SCADA System Login
id: 8e7f6a5b-4c3d-4e2f-8a1b-9c8d7e6f5a4b
status: experimental
description: |
  Detects multiple failed login attempts followed by a success on an HMI or SCADA system. This could indicate a brute-force attempt to gain access using weak or default credentials.
references:
  - https://news.iheart.com/content/2026-09-18-foreign-hackers-breach-colorado-water-utilities-prompt-statewide-alert/
author: cyber.netsecops.io
date: 2026-09-19
tags:
  - attack.t0886
  - attack.initial_access
level: medium
logsource:
  category: authentication
  product: scada # Generic product, assumes logs are forwarded to SIEM
detection:
  selection_success:
    action: 'login'
    status: 'success'
  selection_failure:
    action: 'login'
    status: 'failure'
  timeframe: 10m
  condition: selection_failure | count(user) > 5 and selection_success
---
title: Anomalous ICS Setpoint Modification
id: a7f9d247-3e93-438e-a18a-f31b2b8f9100
status: experimental
description: |
  Detects modifications to critical operational setpoints on ICS/SCADA systems that fall outside of normal parameters or occur outside of standard operator shifts. This is a strong indicator of control system manipulation.
references:
  - https://news.iheart.com/content/2026-09-18-foreign-hackers-breach-colorado-water-utilities-prompt-statewide-alert/
author: cyber.netsecops.io
date: 2026-09-19
tags:
  - attack.t0831
  - attack.impair_process_control
level: critical
logsource:
  category: process_control
  product: scada
detection:
  keywords:
    - 'Setpoint changed'
    - 'Pumping cycle altered'
    - 'Alarm disabled'
    - 'Equipment settings modified'
  filter_normal_hours:
    # Define normal operational hours or authorized users if possible
    user|contains: 'SYSTEM'
  condition: keywords and not filter_normal_hours