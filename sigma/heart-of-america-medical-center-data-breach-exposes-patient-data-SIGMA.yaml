title: Disable Windows Firewall via PowerShell
id: c3d4e5f6-a7b8-4012-8def-123456789012
status: experimental
description: Detects the use of the PowerShell cmdlet 'Disable-NetFirewallRule' to impair system defenses, a common tactic used by ransomware.
references:
  - https://www.claimdepot.com/data-breach/heart-of-america-medical-center-2026
author: cyber.netsecops.io
date: 2026-08-07
tags:
  - attack.t1562.004
  - attack.defense_evasion
level: high
logsource:
  category: ps_script
  product: windows
detection:
  selection:
    ScriptBlockText|contains: 'Disable-NetFirewallRule'
  condition: selection