title: Active Directory Discovery with Native Tools
id: b3b1c8ee-7c7b-4cf3-8e4f-77b850cf078d
status: experimental
description: Detects the use of native Windows tools like nltest and net for Active Directory discovery, often seen during ransomware operations.
references:
  - https://blackkite.com/reports/2026-ransomware-report
author: cyber.netsecops.io
date: 2026-07-29
tags:
  - attack.t1482
  - attack.t1087.002
  - attack.discovery
level: medium
logsource:
  category: process_creation
  product: windows
detection:
  selection_nltest:
    Image|endswith: '\nltest.exe'
    CommandLine|contains:
      - '/dclist'
  selection_net:
    Image|endswith: '\net.exe'
    CommandLine|contains:
      - 'group'
      - '"Domain Admins"'
  condition: 1 of them
---
title: Windows Event Log Clearance with wevtutil
id: 6bb4c754-521e-4697-aaa6-fe8cee87f86a
status: experimental
description: Detects attempts to clear Windows Event Logs using wevtutil.exe, a common defense evasion technique.
references:
  - https://blackkite.com/reports/2026-ransomware-report
author: cyber.netsecops.io
date: 2026-07-29
tags:
  - attack.t1070.001
  - attack.defense_evasion
level: high
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\wevtutil.exe'
    CommandLine|contains|all:
      - 'cl'
  condition: selection
