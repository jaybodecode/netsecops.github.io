title: Suspicious Downloader Execution on IoT Device
id: 2b8c9a1d-4e5f-4a90-8bcd-ef1234567890
status: experimental
description: Detects the execution of downloader utilities like wget or curl on an IoT device, which could indicate an attempt to fetch a malicious payload as seen in the QScan/QTRouter campaign.
references:
  - https://therecord.media/qscan-qtrouter-us-takedown-alleged-china-hacking-tools
author: cyber.netsecops.io
date: 2026-08-27
tags:
  - attack.t1105
  - attack.initial_access
level: high
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    Image|endswith:
      - '/wget'
      - '/curl'
  condition: selection