title: Suspicious SharePoint Picker URL Access
id: 2b8c1d3e-4f5a-4b6c-8d9e-0f1a2b3c4d5e
status: experimental
description: Detects access to the SharePoint picker.aspx page, which could be indicative of exploitation attempts against CVE-2026-50522.
references:
  - https://diesec.com/2026/07/top-5-cybersecurity-news-stories-july-24-2026/
author: cyber.netsecops.io
date: 2026-07-25
tags:
  - attack.t1190
  - attack.initial_access
level: medium
logsource:
  category: proxy
detection:
  selection:
    c-uri-stem|contains: '/_layouts/15/picker.aspx'
  condition: selection
