title: SIDEEYE Backdoor File Artifact
id: 1a2b3c4d-5e6f-4a9b-8c7d-6e5f4a3b2c1d
status: experimental
description: Detects the presence of sideeye.dll, a file artifact associated with the SIDEEYE backdoor used by ShinyHunters.
references:
  - https://cloud.google.com/blog/topics/threat-intelligence/shinyhunters-renewed-mass-exploitation-campaign-targeting-oracle-peoplesoft
author: cyber.netsecops.io
date: 2026-09-26
tags:
  - attack.t1105
level: high
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|endswith: '\sideeye.dll'
  condition: selection