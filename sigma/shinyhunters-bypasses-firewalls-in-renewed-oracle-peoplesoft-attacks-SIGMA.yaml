title: ShinyHunters PeopleSoft WAF Bypass Pattern
id: 4d9f1c8a-6b3e-4f8d-9a2c-1b7e5a0d9f6e
status: experimental
description: Detects URL-encoded patterns used to bypass WAF rules targeting the Oracle PeopleSoft /PSEMHUB/ endpoint, as seen in ShinyHunters campaigns.
references:
  - https://cloud.google.com/blog/topics/threat-intelligence/shinyhunters-renewed-mass-exploitation-campaign-targeting-oracle-peoplesoft
author: cyber.netsecops.io
date: 2026-09-26
tags:
  - attack.t1190
  - attack.t1027
level: high
logsource:
  category: webserver
detection:
  selection:
    c-uri-stem|contains:
      - '/%50SEMHUB/'
      - '/P%53EMHUB/'
      - '/PSE%4dHUB/'
  condition: selection
---
title: PowerShell Encoded Command Execution
id: f8e7d6c5-4b3a-4e2d-8c1b-0a9f8e7d6c5b
status: experimental
description: Detects the use of PowerShell with the '-enc' flag, which is often used by attackers to obfuscate malicious scripts.
references:
  - https://cloud.google.com/blog/topics/threat-intelligence/shinyhunters-renewed-mass-exploitation-campaign-targeting-oracle-peoplesoft
author: cyber.netsecops.io
date: 2026-09-26
tags:
  - attack.t1059.001
level: medium
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\powershell.exe'
    CommandLine|contains: ' -enc '
  condition: selection
---
title: Suspicious MeshCentral Installation or Activity
id: 9e8d7c6b-5a4f-4e3d-8b1a-0f9e8d7c6b5a
status: experimental
description: Detects the presence of MeshCentral.exe or network connections to meshcentral.com from servers not expected to use this tool, such as Oracle PeopleSoft servers.
references:
  - https://cloud.google.com/blog/topics/threat-intelligence/shinyhunters-renewed-mass-exploitation-campaign-targeting-oracle-peoplesoft
author: cyber.netsecops.io
date: 2026-09-26
tags:
  - attack.t1219
level: medium
logsource:
  category: process_creation
  product: windows
detection:
  selection_process:
    Image|endswith: '\MeshCentral.exe'
  condition: selection_process
--- 
title: Suspicious MeshCentral DNS Query
id: 9e8d7c6b-5a4f-4e3d-8b1a-0f9e8d7c6b5b
status: experimental
description: Detects DNS queries for meshcentral.com from servers not expected to use this tool, such as Oracle PeopleSoft servers.
