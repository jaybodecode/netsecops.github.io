title: Suspicious OpenPGP Key File Creation
id: 2b8a1c9d-5e6f-4a3b-8c1d-9e8f7a6b5c4d
status: experimental
description: |
  Detects the creation of OpenPGP key files (.asc, .pgp, .gpg), which could be a delivery vector for exploiting vulnerabilities like CVE-2026-129975 in GPGME.
references:
  - https://thehackernews.com/2026/11/gnupg-warns-critical-gpgme-flaw-could.html
author: cyber.netsecops.io
date: 2026-11-22
tags:
  - attack.t1204.002
level: low
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|endswith:
      - '.asc'
      - '.pgp'
      - '.gpg'
  condition: selection