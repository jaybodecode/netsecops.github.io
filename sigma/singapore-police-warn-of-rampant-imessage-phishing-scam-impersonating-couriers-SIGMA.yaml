title: iMessage Courier Phishing Scam URL
id: 9a7b6c5d-1e2f-4a3b-8c4d-5e6f7a8b9c0d
status: experimental
description: Detects network traffic to a URL known to be used in the iMessage courier phishing scam.
references:
  - https://www.police.gov.sg/Media-Hub/News/2026/08/20260805_police_advisory_on_phishing_scams_impersonating_courier_companies_via_apple_imessage
author: cyber.netsecops.io
date: 2026-08-05
tags:
  - attack.t1566.002
  - attack.initial_access
level: high
logsource:
  category: proxy
detection:
  selection:
    c-uri|contains:
      - 'http://dhl-sg-support.xyz'
  condition: selection
