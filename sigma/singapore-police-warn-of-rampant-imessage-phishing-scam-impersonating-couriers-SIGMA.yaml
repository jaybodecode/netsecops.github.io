title: iMessage Courier Phishing Scam Domain
id: 8b6a5c4d-2d3e-4b2a-9d5e-6f7a8b9c0d1e
status: experimental
description: Detects DNS queries for a domain known to be used in the iMessage courier phishing scam.
references:
  - https://www.police.gov.sg/Media-Hub/News/2026/08/20260805_police_advisory_on_phishing_scams_impersonating_courier_companies_via_apple_imessage
author: cyber.netsecops.io
date: 2026-08-05
tags:
  - attack.t1566.002
  - attack.initial_access
level: high
logsource:
  category: dns_query
  product: windows
detection:
  selection:
    QueryName|endswith:
      - 'dhl-sg-support.xyz'
  condition: selection