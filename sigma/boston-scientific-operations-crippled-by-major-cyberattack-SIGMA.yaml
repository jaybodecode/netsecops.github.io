title: Potential Ransomware Note Creation
id: 1e2f3a4b-5c6d-4e7f-8a9b-0c1d2e3f4a5b
status: experimental
description: Detects the creation of files matching a common ransomware note pattern (*_readme.txt).
references:
  - https://pharmaphorum.com/news/cyberattack-boston-scientific-causes-global-ops-disruption
author: cyber.netsecops.io
date: 2026-08-30
tags:
  - attack.t1486
  - attack.impact
level: medium
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|endswith: '_readme.txt'
  condition: selection