title: Check Point VPN Certificate ASN.1 Decoding Failure
id: 2b8c1f9a-7d3e-4b0c-8a1f-9e2d3c4b5a6b
status: experimental
description: Detects log messages indicating a failure in decoding the ASN.1 structure of a VPN certificate, which could be an attempt to exploit CVE-2026-85103.
references:
  - https://thehackernews.com/2026/09/check-point-discloses-two-98-rated-vpn.html
author: cyber.netsecops.io
date: 2026-09-13
tags:
  - attack.t1190
level: high
logsource:
  product: checkpoint
  category: firewall
detection:
  keywords:
    - 'decoding ASN.1 structure failed'
  condition: keywords
