title: Check Point VPN Daemon (vpnd) Crash
id: 5e8d4f2a-1b9c-4d7e-8a6f-0c1d2e3f4b5a
status: experimental
description: Detects crashes of the Check Point VPN daemon (vpnd), which could indicate exploitation attempts against CVE-2026-85102 or CVE-2026-85103.
references:
  - https://thehackernews.com/2026/09/check-point-discloses-two-98-rated-vpn.html
author: cyber.netsecops.io
date: 2026-09-13
tags:
  - attack.t1190
  - attack.t1499
level: high
logsource:
  product: linux
  category: system
detection:
  selection:
    keywords:
      - 'vpnd'
      - 'segfault'
  condition: all of selection