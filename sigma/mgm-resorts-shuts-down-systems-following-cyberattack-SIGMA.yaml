title: Potential Attacker Tool Execution for Lateral Movement
id: 2b8a1c9d-5e7f-4b3a-8c6d-9e0f1a2b3c4d
status: experimental
description: Detects the execution of legitimate tools often abused by attackers for lateral movement and reconnaissance, as suggested in hunting hints for major enterprise breaches.
references:
  - https://cypro.co.uk/insights/cyber-bulletins/mgm-resorts-cyber-attack-disrupts-operations/
author: cyber.netsecops.io
date: 2026-09-24
tags:
  - attack.t1570
  - attack.t1047
  - attack.t1059.001
level: medium
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\PsExec.exe'
      - '\psexec.c'
      - '\wmic.exe'
      - '\powershell.exe'
  condition: selection