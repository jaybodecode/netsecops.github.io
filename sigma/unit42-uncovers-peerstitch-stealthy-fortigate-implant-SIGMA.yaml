title: FortiOS Path Traversal Attempt in Auto-Script
id: 7f3a4b5c-6d7e-4f8a-a0b1-c2d3e4f5a6b7
status: experimental
description: Detects attempts to exploit CVE-2025-61624 by creating a FortiOS 'system auto-script' object with a name containing path traversal sequences.
references:
  - https://unit42.paloaltonetworks.com/fortimanager-cve-2024-47575-peerstitch-malware/
author: cyber.netsecops.io
date: 2026-10-15
tags:
  - attack.t1059.008
  - attack.execution
level: high
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    CommandLine|contains|all:
      - 'config system auto-script'
      - 'edit "'
      - '../'
  condition: selection
