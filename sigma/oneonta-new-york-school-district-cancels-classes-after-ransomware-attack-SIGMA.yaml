title: VSSAdmin Delete Shadow Copies
id: 2b8a1b9c-7d3e-4f6a-8b1c-9d2e8f7a6b5a
status: experimental
description: Detects the use of vssadmin.exe to delete volume shadow copies, a common technique used by ransomware to inhibit system recovery.
references:
  - https://dysruptionhub.com/oneonta-new-york-schools-ransomware-attack/
author: cyber.netsecops.io
date: 2026-10-23
tags:
  - attack.t1490
  - attack.impact
level: high
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains|all:
      - 'delete'
      - 'shadows'
  condition: selection
---
title: PowerShell Encoded Command Execution
id: 4b4f5159-0c0f-4b47-b9ee-b894807f8bcd
status: experimental
description: Detects the execution of PowerShell with encoded commands, a common technique for obfuscating and downloading malware.
references:
  - https://dysruptionhub.com/oneonta-new-york-schools-ransomware-attack/
author: cyber.netsecops.io
date: 2026-10-23
tags:
  - attack.t1059.001
  - attack.execution
level: medium
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - ' -e '
      - ' -en '
      - ' -enc '
      - ' -enco'
      - ' -encod'
      - ' -encode'
      - ' -encoded'
      - ' -encodedc'
      - ' -encodedco'
      - ' -encodedcom'
      - ' -encodedcomm'
      - ' -encodedcomma'
      - ' -encodedcomman'
      - ' -encodedcommand'
  condition: selection