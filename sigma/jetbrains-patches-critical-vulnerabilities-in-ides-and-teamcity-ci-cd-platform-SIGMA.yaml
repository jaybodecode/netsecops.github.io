title: JetBrains TeamCity Server Spawning Suspicious Shell
id: 2b8a1c9d-5b7e-4f3a-8d6c-9e0f1a2b3c4d
status: experimental
description: Detects the JetBrains TeamCity server process (typically java.exe) spawning common command shells, which could indicate exploitation of RCE vulnerabilities like CVE-2026-65907 or CVE-2026-65906.
references:
  - https://seceon.com/critical-jetbrains-vulnerabilities-could-allow-attackers-to-execute-malicious-code/
author: cyber.netsecops.io
date: 2026-08-05
tags:
  - attack.t1190
  - attack.t1497
level: high
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|contains: 'java.exe'
    ParentCommandLine|contains: 'TeamCity'
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\sh.exe'
      - '\bash.exe'
  condition: selection_parent and selection_child
---
title: JetBrains IDE Spawning Suspicious Shell
id: 3ae12059-40c3-487d-a819-f9b0d54e47e6
status: experimental
description: Detects JetBrains IDE processes spawning command shells, which could indicate exploitation of the command injection vulnerability CVE-2026-49366.
references:
  - https://seceon.com/critical-jetbrains-vulnerabilities-could-allow-attackers-to-execute-malicious-code/
author: cyber.netsecops.io
date: 2026-08-05
tags:
  - attack.t1059
level: high
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
      - '\idea.exe'
      - '\pycharm.exe'
      - '\webstorm.exe'
      - '\goland.exe'
      - '\clion.exe'
      - '\phpstorm.exe'
      - '\rubymine.exe'
      - '\rider.exe'
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\sh.exe'
      - '\bash.exe'
  condition: selection_parent and selection_child