title: VSSAdmin Shadow Copy Deletion
id: 2b8a1c9d-f3e4-4b1a-8c7d-9e0f1a2b3c4d
status: experimental
description: Detects the use of vssadmin.exe to delete volume shadow copies, a common ransomware technique to inhibit system recovery.
references:
  - https://www.breachsense.com/breaches/
author: cyber.netsecops.io
date: 2026-09-30
tags:
  - attack.t1490
level: high
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains|all:
      - 'delete'
      - 'shadows'
  condition: selection
---
