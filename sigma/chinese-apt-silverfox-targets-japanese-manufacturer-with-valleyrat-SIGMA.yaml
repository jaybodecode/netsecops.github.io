title: SilverFox Vulnerable Driver Load for Privilege Escalation
id: 1d2e3f4a-5b6c-4d7e-8f9a-0b1c2d3e4f5a
status: experimental
description: Detects the loading of known vulnerable kernel drivers (BootRepair.sys, EnPortv.sys) used by SilverFox for privilege escalation.
references:
  - https://securityaffairs.com/196347/apt/silverfox-targets-japanese-manufacturer-with-advanced-valleyrat-campaign.html
author: cyber.netsecops.io
date: 2026-07-31
tags:
  - attack.t1068
level: high
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith:
      - '\BootRepair.sys'
      - '\EnPortv.sys'
  condition: selection
