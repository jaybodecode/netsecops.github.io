title: VSSAdmin Shadow Copy Deletion
id: 2b8a1c9d-4e6f-4b8a-a9d8-7c6b5a4d3e2f
status: experimental
description: Detects the use of vssadmin.exe to delete volume shadow copies, a common ransomware TTP to inhibit system recovery.
references:
  - https://blackkite.com/reports/2026-ransomware-report
author: cyber.netsecops.io
date: 2026-07-24
tags:
  - attack.t1490
  - attack.impact
level: high
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains|all:
      - 'delete'
      - 'shadows'
  condition: selection
---
title: Ransomware File Renaming Activity
id: 9e3d5c1a-8b7a-4f9c-b1d2-6a5c4b3d2e1f
status: experimental
description: Detects file rename events where files are given common ransomware-associated extensions.
references:
  - https://blackkite.com/reports/2026-ransomware-report
author: cyber.netsecops.io
date: 2026-07-24
tags:
  - attack.t1486
  - attack.impact
level: high
logsource:
  category: file_event
  product: windows
detection:
  selection:
    EventType: 'rename'
    TargetFilename|endswith:
      - '.qilin'
      - '.lockbit'
  condition: selection