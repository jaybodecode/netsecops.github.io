title: Bluetooth Low Energy Interaction with Gatttool
id: 2b8a1c9d-5e6f-4a3b-8c1d-9e8f7a6b5c4d
status: experimental
description: Detects the use of gatttool, which can be used to scan for and interact with Bluetooth Low Energy devices like the vulnerable Elecbrakes controllers.
author: cyber.netsecops.io
date: 2026-11-24
references:
  - https://www.securityweek.com/elecbrakes-bluetooth-vulnerabilities-expose-trailers-to-forced-braking/
tags:
  - attack.t1595
  - attack.t0861
level: low
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith: '/gatttool'
  condition: selection