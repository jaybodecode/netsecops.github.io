title: Suspicious WMIC Execution for Lateral Movement
id: 993de566-64f1-47ed-8efd-7295f9582c64
status: experimental
description: Detects the use of wmic.exe to execute processes on remote systems, a technique often used for lateral movement.
references:
  - https://blackkite.com/reports/2026-ransomware-report
author: cyber.netsecops.io
date: 2026-07-26
tags:
  - attack.t1047
  - attack.execution
level: medium
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\wmic.exe'
    CommandLine|contains|all:
      - '/node:'
      - 'process'
      - 'call'
      - 'create'
  condition: selection
