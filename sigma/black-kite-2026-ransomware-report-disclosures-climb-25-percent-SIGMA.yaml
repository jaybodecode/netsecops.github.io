title: VSSAdmin Shadow Copy Deletion
id: 2b8bde45-5b38-4208-93f6-2c6d48b2a40e
status: experimental
description: Detects the use of vssadmin.exe to delete volume shadow copies, a common ransomware tactic to inhibit system recovery.
references:
  - https://blackkite.com/reports/2026-ransomware-report
author: cyber.netsecops.io
date: 2026-07-26
tags:
  - attack.t1490
  - attack.impact
level: high
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains|all:
      - 'delete'
      - 'shadows'
  condition: selection
---
