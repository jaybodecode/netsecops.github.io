title: Anomalous High Volume Cloud Data Retrieval API Calls
id: 5d8c1f9a-3d4e-4b1a-8c9d-0e1f2a3b4c6e
status: experimental
description: Detects a high volume of data retrieval API calls (e.g., s3:GetObject) from cloud storage, especially from unexpected source IPs. This pattern is indicative of bulk data collection by groups like ShinyHunters. This rule is a template and requires tuning and aggregation in a SIEM to be effective.
references:
  - https://securityboulevard.com/2026/07/kodak-breached-by-shinyhunters-the-extortion-group-that-wont-stop-until-every-enterprise-platform-is-hit/
author: cyber.netsecops.io
date: 2026-07-25
tags:
  - attack.t1530
  - attack.collection
level: medium
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: 'GetObject'
  filter_known_ips:
    sourceIpAddress|cidr:
      - '198.51.100.0/24' # Placeholder for known corporate IP ranges
  condition: selection and not filter_known_ips