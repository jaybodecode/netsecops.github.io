title: Anomalous Network Traffic from IT to OT Segments
id: 7f8b1a2c-9d0e-4f3a-8b1c-2d4e6f8a0b2c
status: experimental
description: Detects potentially malicious lateral movement from the corporate (IT) network to the industrial control (OT) network, indicated by traffic to unusual ports or protocols.
author: cyber.netsecops.io
date: 2026-08-07
references:
  - https://cyberscoop.com/north-carolina-ports-cyberattack-coast-guard/
tags:
  - attack.t0886
level: medium
logsource:
  category: firewall
detection:
  selection:
    src_interface: 'it_segment'
    dst_interface: 'ot_segment'
  filter_known_ports:
    dst_port:
      - 502
      - 2404
      - 44818
      - 20000
      - 47808
  condition: selection and not filter_known_ports
---
title: Suspicious Remote Access Tool Usage on OT Workstations
id: 1e2f3a4b-5c6d-4e8f-9a0b-1c2d3e4f5a6b
status: experimental
description: Detects the use of remote access tools like mstsc.exe or plink.exe on operator workstations, which could indicate unauthorized remote access.
author: cyber.netsecops.io
date: 2026-08-07
references:
  - https://cyberscoop.com/north-carolina-ports-cyberattack-coast-guard/
tags:
  - attack.t1021
  - attack.t1021.001
level: medium
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith:
      - '\mstsc.exe'
      - '\plink.exe'
  condition: selection
---
title: Internal Network Scanning Detected
id: b3c4d5e6-f7a8-4901-8234-567890123456
status: experimental
description: Detects the use of network scanning tools like nmap or masscan on the internal network, which could indicate reconnaissance activity.
author: cyber.netsecops.io
date: 2026-08-07
references:
  - https://cyberscoop.com/north-carolina-ports-cyberattack-coast-guard/
tags:
  - attack.t1046
level: medium
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith:
      - '\nmap.exe'
      - '\masscan.exe'
  condition: selection