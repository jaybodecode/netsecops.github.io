title: Play Ransomware Associated Filenames
id: 8f51bb76-62e1-46ba-8c7b-b766df8bb36d
status: experimental
description: Detects filenames associated with Play ransomware activity, including the AdFind reconnaissance tool and the ransom note.
references:
  - https://www.hookphish.com/blog/ransomware-group-play-hits-cambridge-management/
author: cyber.netsecops.io
date: 2026-08-02
tags:
  - attack.t1018
  - attack.t1486
level: high
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|endswith:
      - '\AdFind.exe'
      - '\Play.readme'
  condition: selection