title: FortiGate Packet Sniffing Command Execution
id: a6abc85b-1498-441a-a0b4-753a46b36dca
status: experimental
description: Detects the use of the 'diagnose sniffer packet' command on a FortiGate device. This could indicate an attempt to intercept traffic, as seen with the custom sniffer tool in the FortiBleed campaign.
references:
  - https://www.cybersecuritydive.com/news/fbi-fortibleed-credential-harvesting-attacks/832366/
author: cyber.netsecops.io
date: 2026-10-07
tags:
  - attack.t1040
  - attack.collection
level: medium
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    CommandLine|contains: 'diagnose sniffer packet'
  condition: selection