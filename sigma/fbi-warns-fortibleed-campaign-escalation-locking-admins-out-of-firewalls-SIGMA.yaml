title: FortiGate User Login Failed
id: 9c5b1a3d-6e8f-4b1a-9c8d-7e6f5d4c3b2a
status: experimental
description: Detects a failed user login on a FortiGate device (eventid 32002). A high volume of this event from a single source IP may indicate a brute-force attempt as seen in the FortiBleed campaign.
references:
  - https://www.cybersecuritydive.com/news/fbi-fortibleed-credential-harvesting-attacks/832366/
author: cyber.netsecops.io
date: 2026-10-07
tags:
  - attack.t1110
  - attack.credential_access
level: low
logsource:
  category: firewall
detection:
  selection:
    event_id: 32002
  condition: selection
