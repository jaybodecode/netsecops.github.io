title: VSSAdmin Shadow Copy Deletion
id: 2b8a1c9e-7d4f-4b6a-8c1d-9e0f1a2b3c4d
status: experimental
description: Detects the use of vssadmin.exe to delete volume shadow copies, a common technique used by ransomware to inhibit system recovery. Based on hunting hints from the Qilin attack on Burnaby School District.
references:
  - https://vancouver.citynews.ca/2026/11/05/burnaby-school-district-cyberattack-former-staff/
author: cyber.netsecops.io
date: 2026-11-05
tags:
  - attack.t1490
  - attack.impact
level: high
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains|all:
      - 'delete'
      - 'shadows'
  condition: selection
---
title: Suspicious Large Outbound Data Transfer to Cloud Storage
id: 8d9e0f1a-2b3c-4d5e-b6f7-a8b9c0d1e2f3
status: experimental
description: Detects large data uploads to common cloud storage providers (Mega, pCloud), which can indicate data exfiltration prior to a ransomware attack. Based on hunting hints from the Qilin attack on Burnaby School District.
references:
  - https://vancouver.citynews.ca/2026/11/05/burnaby-school-district-cyberattack-former-staff/
author: cyber.netsecops.io
date: 2026-11-05
tags:
  - attack.t1567.002
  - attack.exfiltration
level: medium
logsource:
  category: proxy
detection:
  selection:
    cs-host|endswith:
      - 'mega.nz'
      - 'pcloud.com'
    sc-bytes|gt: 100000000
  condition: selection
---
title: Qilin Ransom Note Creation
id: 4a5b6c7d-8e9f-4a0b-8c1d-2e3f4a5b6c7d
status: experimental
description: Detects the creation of the Qilin ransom note file 'How to restore your files.txt'. Based on hunting hints from the Qilin attack on Burnaby School District.
references:
  - https://vancouver.citynews.ca/2026/11/05/burnaby-school-district-cyberattack-former-staff/
author: cyber.netsecops.io
date: 2026-11-05
tags:
  - attack.t1486
  - attack.impact
level: high
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|endswith: '\How to restore your files.txt'
  condition: selection