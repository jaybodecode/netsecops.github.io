title: Gunra Ransomware File Encryption Extension
id: c396ebb6-bd11-4936-8cb5-e4433ed469d2
status: experimental
description: Detects the creation of files with the .ENCRT extension, which is appended by Gunra ransomware.
references:
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-222a
author: cyber.netsecops.io
date: 2026-08-11
tags:
  - attack.t1486
  - attack.impact
level: critical
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|endswith: '.ENCRT'
  condition: selection
---
title: Gunra Ransom Note Creation
id: 21e1b6ae-280c-463b-aa06-7fb585c0ed5d
status: experimental
description: Detects the creation of ransom notes named 'readme.txt', a common behavior for Gunra ransomware.
references:
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-222a
author: cyber.netsecops.io
date: 2026-08-11
tags:
  - attack.t1486
  - attack.impact
level: high
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|endswith: '\readme.txt'
  condition: selection
---
title: Gunra Ransomware Shadow Copy Deletion
id: 14d67cd1-eabf-42ac-9364-f4ebf57badcd
status: experimental
description: Detects the use of vssadmin.exe to delete volume shadow copies, a technique used by Gunra ransomware to inhibit system recovery.
references:
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-222a
author: cyber.netsecops.io
date: 2026-08-11
tags:
  - attack.t1490
  - attack.defense_evasion
level: high
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains|all:
      - 'delete'
      - 'shadows'
  condition: selection
---
title: Gunra qTox Negotiation Traffic
id: a60a2e0c-d2fe-473a-914c-8ff0bfc39c90
status: experimental
description: Detects potential negotiation communication with Gunra operators via the qTox P2P messaging service.
references:
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-222a
author: cyber.netsecops.io
date: 2026-08-11
tags:
  - attack.t1071
  - attack.command_and_control
level: medium
logsource:
  category: dns_query
  product: windows
detection:
  selection:
    QueryName|contains: 'qtox.so'
  condition: selection