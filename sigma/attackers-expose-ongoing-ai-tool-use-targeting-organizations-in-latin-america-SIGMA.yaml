title: Volume Shadow Copy Creation via vssadmin
id: eeba7bd8-b7a5-4fe2-8cc1-4b8f89cc3db5
status: experimental
description: Detects the use of vssadmin.exe to create a volume shadow copy, a technique used by CL-CRI-1131 to access locked files like SAM and NTDS.dit for credential dumping.
references:
  - https://unit42.paloaltonetworks.com/ai-tool-use-targeting-latam-orgs/
author: cyber.netsecops.io
date: 2026-09-03
tags:
  - attack.t1003
  - attack.t1490
level: medium
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains:
      - 'create shadow'
  condition: selection
---
title: Suspicious Outbound DNS Query to DuckDNS
id: 99b79e74-1dcd-4b3d-ba3d-3df0f15b7e25
status: experimental
description: 'Monitors for DNS queries to the dynamic DNS provider duckdns.org, which is uncommon for legitimate corporate traffic and was used by attackers in this campaign for C2.'
references:
  - https://unit42.paloaltonetworks.com/ai-tool-use-targeting-latam-orgs/
author: cyber.netsecops.io
date: 2026-09-03
tags:
  - attack.t1568
  - attack.command_and_control
level: low
logsource:
  category: dns_query
  product: windows
detection:
  selection:
    QueryName|endswith: '.duckdns.org'
  condition: selection
