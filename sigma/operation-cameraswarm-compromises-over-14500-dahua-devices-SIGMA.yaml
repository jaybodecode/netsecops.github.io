author: cyber.netsecops.io
date: 2026-08-20
tags:
  - attack.t1105
level: high
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    DestinationIp: '154.86.119.60'
    Initiated: 'true'
  condition: selection