title: Anubis Ransomware File Extension Detected
id: 3c9d0b2e-f4e5-4c6b-9d7e-8f9a0b1c2d3e
status: experimental
description: Detects the creation of files with the .anubis extension, which is associated with the Anubis ransomware family.
references:
  - https://www.brightdefense.com/resources/recent-data-breaches/
author: cyber.netsecops.io
date: 2026-07-26
tags:
  - attack.t1486
level: critical
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|endswith: '.anubis'
  condition: selection
