title: Potential SQL Injection Attempt in URL
id: 2b8c9a1d-f3e4-4b5a-8c6d-7e8f9a0b1c2d
status: experimental
description: Detects patterns indicative of SQL injection attempts in URL strings, as suggested for hunting data breach activity.
references:
  - https://www.brightdefense.com/resources/recent-data-breaches/
author: cyber.netsecops.io
date: 2026-07-26
tags:
  - attack.t1190
level: high
logsource:
  category: webserver
detection:
  selection:
    c-uri|contains:
      - "' OR '1'='1"
  condition: selection
