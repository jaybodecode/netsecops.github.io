title: Suspicious Shell Execution on Web Server
id: 9a7b6c5d-4e3f-4a2b-8c1d-0e9f8a7b6c5d
status: experimental
description: Detects the execution of a shell process ('sh') on a server, which could indicate remote code execution, as seen in the Gyazo breach.
author: cyber.netsecops.io
date: 2026-09-17
references:
  - https://thehackernews.com/2026/09/gyazo-breach-exposes-2362-million-user.html
tags:
  - attack.t1059.004
level: high
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith: '/sh'
    ParentImage|endswith:
      - '/httpd'
      - '/nginx'
      - '/apache2'
      - '/php-fpm'
  condition: selection
---
