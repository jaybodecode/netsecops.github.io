title: Anomalous Child Process from SAP Dispatcher
id: 2b8c1a9f-7e4d-4b1a-9c8d-3e5f6a7b8c9d
status: experimental
description: |
  Monitors for the SAP dispatcher and worker processes (disp+work.exe or dw.sap) spawning shell processes.
  This could indicate remote code execution following exploitation of vulnerabilities like ICM2SHELL or PROXYGATE.
references:
  - https://mlq.ai/news/sap-patches-four-maximum-severity-flaws-including-onapsis-found-icm2shell-and-proxygate/
author: cyber.netsecops.io
date: 2026-11-10
tags:
  - attack.t1190
level: high
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
      - '\disp+work.exe'
      - '\dw.sap'
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\sh.exe'
      - '\bash.exe'
  condition: all of selection_*
falsepositives:
  - Legitimate administrative scripts that call shells from SAP processes.
