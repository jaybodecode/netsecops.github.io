author: cyber.netsecops.io
date: 2026-08-07
tags:
  - attack.t1195.002
level: high
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|endswith:
      - '\Math_Symbol.js'
      - '\math_init.js'
  condition: selection