title: csc.exe Execution
id: 857859b5-ad75-47dd-8099-36c0b9eb3506
status: experimental
description: Detects the execution of the C# compiler (csc.exe), which could be anomalous on build servers during a supply chain attack.
references:
  - https://securityaffairs.com/203085/cyber-crime/german-military-grounds-quantum-systems-drones-following-reported-cyberattack.html
author: cyber.netsecops.io
date: 2026-11-16
tags:
  - attack.t1195.002
level: low
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\csc.exe'
  condition: selection