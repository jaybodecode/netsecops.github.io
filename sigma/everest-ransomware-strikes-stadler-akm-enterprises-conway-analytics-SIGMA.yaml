title: VSSAdmin Shadow Copy Deletion
id: 8b0b9dee-283e-45f8-b610-d9cb37515ba2
status: experimental
description: Detects the use of vssadmin.exe to delete volume shadow copies, a common ransomware tactic to inhibit system recovery.
references:
  - https://securityboulevard.com/2026/07/top-10-breaches-of-the-week-4/
author: cyber.netsecops.io
date: 2026-08-01
tags:
  - attack.t1490
  - attack.impact
level: high
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains|all:
      - 'delete'
      - 'shadows'
  condition: selection