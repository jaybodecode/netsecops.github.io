title: Disabling of Security Services via Command Line
id: fc0e69fe-d8f1-4c31-9b53-8c8169e8a080
status: experimental
description: Detects attempts to stop or disable common security services using command-line tools like 'net.exe' or 'sc.exe'. This is a common defense evasion technique.
references:
  - https://topclassactions.com/lawsuit-settlements/lawsuit-news/conduents-massive-data-breach-leads-to-proposed-80-million-class-action-settlement/
author: cyber.netsecops.io
date: 2026-10-25
tags:
  - attack.t1562.001
  - attack.defense_evasion
level: high
logsource:
  category: process_creation
  product: windows
detection:
  selection_sc:
    Image|endswith: '\sc.exe'
    CommandLine|contains:
      - ' stop '
      - ' config '
  selection_net:
    Image|endswith: '\net.exe'
    CommandLine|contains: ' stop '
  selection_services:
    CommandLine|contains:
      - 'WinDefend' # Windows Defender
      - 'MsMpSvc'   # Windows Defender
      - 'Sense'     # Windows Defender ATP
      - 'Sysmon'    # Sysmon
      - 'MBAMService' # Malwarebytes
  condition: (selection_sc or selection_net) and selection_services