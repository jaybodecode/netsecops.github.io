description: Detects the execution of a process named wiper.exe, which may be associated with the Anubis ransomware's file-wiping component.
references:
  - https://shattered.io/two-ransomware-gangs-claim-interim-healthcare-2026/
author: cyber.netsecops.io
date: 2026-09-11
tags:
  - attack.t1485
  - attack.impact
level: high
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\wiper.exe'
  condition: selection