title: VSSAdmin Shadow Copy Deletion
id: 7b8a1c2d-e3f4-4a5b-8c6d-7e8f9a0b1c2d
status: experimental
description: Detects the use of vssadmin.exe to delete volume shadow copies, a common technique used by ransomware to inhibit system recovery.
references:
  - https://shattered.io/two-ransomware-gangs-claim-interim-healthcare-2026/
author: cyber.netsecops.io
date: 2026-09-11
tags:
  - attack.t1490
  - attack.impact
level: high
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains|all:
      - 'delete'
      - 'shadows'
  condition: selection
---
title: Wiper.exe Process Execution
id: 8c9b2d3e-f4a5-4b6c-9d7e-8f9a0b1c2d3e
