title: Windows Account Lockout
id: 8d1e2f3a-4b5c-4a1b-8c6a-0d1e2f3a4b5d
status: experimental
description: Detects Windows account lockouts (Event ID 4740), which can indicate brute force or password spraying attempts.
references:
