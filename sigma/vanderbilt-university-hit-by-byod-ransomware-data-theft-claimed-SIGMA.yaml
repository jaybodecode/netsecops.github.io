title: Windows Event Log Clearing with Wevtutil
id: 55d5c3be-cbb6-4a97-a11f-4af74edaf3ed
status: experimental
description: Detects the use of wevtutil.exe to clear Windows Event Logs, a common defense evasion technique.
author: cyber.netsecops.io
date: 2026-11-11
references:
  - https://www.bleepingcomputer.com/news/security/vanderbilt-university-hit-in-byod-ransomware-attack-data-theft-claimed/
tags:
  - attack.t1070.001
  - attack.defense_evasion
level: high
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\wevtutil.exe'
    CommandLine|contains:
      - ' cl '
      - ' clear-log '
  condition: selection