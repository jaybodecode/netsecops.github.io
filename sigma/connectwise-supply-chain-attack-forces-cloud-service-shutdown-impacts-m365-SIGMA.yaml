title: Anomalous M365 Application Role Assignment
id: f0f5bd4d-4aca-49d4-90f0-22e7d3e6086c
status: experimental
description: Detects anomalous activity by a service principal, such as 'Add app role assignment', which could indicate abuse of a compromised OAuth application as seen in the ConnectWise incident.
references:
  - https://www.cybersecuritydive.com/news/connecwise-suspends-cloud-backup-hacker-microsoft-365/833345/
author: cyber.netsecops.io
date: 2026-10-20
tags:
  - attack.t1098.003
level: medium
logsource:
  product: m365
  service: audit.azuread
detection:
  selection:
    Operation: 'Add app role assignment to service principal'
  condition: selection
---
title: Suspicious M365 Sign-in from ConnectWise Attacker IP
id: 2b1a9c8d-4e5f-4a3b-8c7d-6e5f4a3b2c1d
status: experimental
description: Detects Microsoft 365 sign-in activity from an IP address associated with the ConnectWise supply chain attack in October 2026.
references:
  - https://www.cybersecuritydive.com/news/connecwise-suspends-cloud-backup-hacker-microsoft-365/833345/
author: cyber.netsecops.io
date: 2026-10-20
tags:
  - attack.t1078.004
level: high
logsource:
  product: azure
  service: signinlogs
detection:
  selection:
    IPAddress: '144.172.64.128'
  condition: selection